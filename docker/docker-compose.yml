version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: bandangweb_db
    environment:
      POSTGRES_USER: bandang_user
      POSTGRES_PASSWORD: bandang_password
      POSTGRES_DB: bandangweb_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bandang_user -d bandangweb_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: bandangweb_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: bandangweb_app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://bandang_user:bandang_password@db:5432/bandangweb_db
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=db+sqlite:///celery-results.sqlite
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ..:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
